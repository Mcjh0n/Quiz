<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cereal Science & Technology - Advanced Interactive Examination</title>
<style>
  :root {
    --primary: #1e3a8a;
    --primary-light: #3b82f6;
    --primary-dark: #1e293b;
    --accent: #d97706;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #0f172a;
    --text-muted: #475569;
    --border: #e2e8f0;
    --correct-bg: #dcfce7;
    --correct-border: #16a34a;
    --correct-text: #14532d;
    --incorrect-bg: #fee2e2;
    --incorrect-border: #dc2626;
    --incorrect-text: #7f1d1d;
    --radius: 12px;
    --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
  .quiz-container { max-width: 900px; margin: 0 auto; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border); }
  
  .header { background: linear-gradient(135deg, #1e3a8a, #0f172a); color: white; padding: 24px; text-align: center; position: relative; }
  .header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
  .header p { font-size: 0.9rem; opacity: 0.85; }
  
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: #f1f5f9; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
  .progress-bar-container { height: 8px; background: #e2e8f0; width: 100%; }
  .progress-bar { height: 100%; background: var(--primary-light); width: 0%; transition: width 0.3s ease; }

  .card-body { padding: 28px; }
  
  .q-meta-tag { display: inline-block; padding: 4px 10px; background: #eff6ff; color: var(--primary); border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
  .q-text { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 18px; }
  
  .statement-box { background: #f8fafc; border-left: 4px solid var(--primary-light); padding: 14px 18px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 0.98rem; }
  .statement { margin-bottom: 10px; font-weight: 500; }
  .statement:last-child { margin-bottom: 0; }
  .stmt-label { font-weight: 700; color: var(--primary-dark); }

  .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
  .option-btn { display: flex; align-items: center; text-align: left; background: #fff; border: 2px solid var(--border); border-radius: 8px; padding: 14px 18px; cursor: pointer; transition: all 0.2s ease; font-size: 0.95rem; font-weight: 500; width: 100%; color: var(--text); }
  .option-btn:hover:not(:disabled) { border-color: var(--primary-light); background: #f0f7ff; }
  .option-btn.selected { border-color: var(--primary-light); background: #eff6ff; }
  .option-letter { width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; margin-right: 14px; flex-shrink: 0; color: var(--text-muted); }
  .option-btn.selected .option-letter { background: var(--primary-light); color: white; }

  .option-btn.correct-choice { border-color: var(--correct-border); background: var(--correct-bg); color: var(--correct-text); }
  .option-btn.correct-choice .option-letter { background: var(--correct-border); color: white; }
  .option-btn.wrong-choice { border-color: var(--incorrect-border); background: var(--incorrect-bg); color: var(--incorrect-text); }
  .option-btn.wrong-choice .option-letter { background: var(--incorrect-border); color: white; }

  .explanation-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 24px; font-size: 0.92rem; display: none; }
  .explanation-box.visible { display: block; }
  .exp-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
  .exp-title.correct { color: var(--correct-border); }
  .exp-title.incorrect { color: var(--incorrect-border); }
  .exp-detail { color: var(--text-muted); line-height: 1.6; }

  .controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 20px; }
  .btn { padding: 10px 22px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; border: none; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
  .btn-secondary { background: #e2e8f0; color: var(--text-muted); }
  .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .results-screen { padding: 36px 28px; text-align: center; }
  .score-circle { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }
  .score-val { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .score-total { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
  
  .review-section { text-align: left; margin-top: 32px; border-top: 1px solid var(--border); padding-top: 24px; }
  .filter-nav { display: flex; gap: 8px; margin-bottom: 20px; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .review-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 14px; font-size: 0.9rem; }
  .review-card.is-correct { border-left: 4px solid var(--correct-border); }
  .review-card.is-incorrect { border-left: 4px solid var(--incorrect-border); }

  .nav-grid-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
  .nav-grid-content { background: white; border-radius: 12px; max-width: 600px; width: 90%; padding: 24px; max-height: 80vh; overflow-y: auto; }
  .grid-layout { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-top: 16px; }
  .grid-item { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
  .grid-item.answered { background: #e0f2fe; border-color: #0284c7; color: #0369a1; }
  .grid-item.current { ring: 2px solid var(--primary); font-weight: 900; background: var(--primary); color: white; }

  @media (max-width: 640px) {
    .grid-layout { grid-template-columns: repeat(5, 1fr); }
    .quiz-meta { font-size: 0.75rem; padding: 10px 16px; }
    .card-body { padding: 18px; }
  }
</style>
</head>
<body>

<div class="quiz-container">
  <div class="header">
    <h1>Cereal Science & Technology</h1>
    <p>Comprehensive 75-Item Advanced Interactive Examination</p>
  </div>
  
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="quiz-meta">
    <span id="questionTracker">Question 1 of 75</span>

    <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="openNavGrid()">Jump to Question</button>
  </div>

  <div class="card-body" id="quizBody">
    <!-- Active question will render here -->
  </div>

  <div class="card-body results-screen" id="resultsBody" style="display: none;">
    <div class="score-circle">
      <span class="score-val" id="finalScoreVal">0</span>
      <span class="score-total">out of 75</span>
    </div>
    <h2 id="gradeTitle" style="margin-bottom: 8px; font-weight: 700;">Examination Completed</h2>
    <p id="gradeFeedback" color="var(--text-muted)" style="margin-bottom: 24px; font-size: 0.95rem;"></p>

    <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 24px;">
      <button class="btn btn-primary" onclick="restartQuiz()">Retake Examination</button>
    </div>

    <div class="review-section">
      <h3 style="margin-bottom: 14px; font-size: 1.1rem;">Item Analysis & Review</h3>
      <div class="filter-nav">
        <button class="filter-btn active" onclick="filterReview('all')">All Items (75)</button>
        <button class="filter-btn" onclick="filterReview('incorrect')">Incorrect Only</button>
        <button class="filter-btn" onclick="filterReview('correct')">Correct Only</button>
      </div>
      <div id="reviewContainer"></div>
    </div>
  </div>
</div>

<!-- Jump Navigation Modal -->
<div class="nav-grid-modal" id="navGridModal">
  <div class="nav-grid-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="font-size: 1.1rem; font-weight: 700;">Question Navigator</h3>
      <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="closeNavGrid()">✕</button>
    </div>
    <div class="grid-layout" id="gridLayout"></div>
  </div>
</div>

// STATE MANAGEMENT
let currentQIndex = 0;
let userAnswers = new Array(quizData.length).fill(null);
let reviewFilter = 'all';

// INITIALIZATION
window.onload = () => {
  renderQuestion();
  buildNavGrid();
};

function renderQuestion() {
  const q = quizData[currentQIndex];
  const total = quizData.length;

  // Update Progress & Trackers
  document.getElementById('questionTracker').innerText = `Question ${currentQIndex + 1} of ${total}`;
  document.getElementById('progressBar').style.width = `${((currentQIndex + 1) / total) * 100}%`;
  
  let currentScore = userAnswers.reduce((acc, ans, idx) => (ans === quizData[idx].answer ? acc + 1 : acc), 0);
  document.getElementById('scoreTracker').innerText = `Score: ${currentScore} / ${total}`;

  const container = document.getElementById('quizBody');
  const isAnswered = userAnswers[currentQIndex] !== null;
  const selectedAns = userAnswers[currentQIndex];

  let html = `
    <span class="q-meta-tag">${q.topic}</span>
  `;

  if (q.type === 'two-statement') {
    html += `
      <div class="q-text">Item ${q.id}: Evaluate Statement 1 and Statement 2 independently, then select the correct statement logic option.</div>
      <div class="statement-box">
        <div class="statement"><span class="stmt-label">Statement 1:</span> ${q.statement1}</div>
        <div class="statement"><span class="stmt-label">Statement 2:</span> ${q.statement2}</div>
      </div>
    `;
  } else {
    html += `
      <div class="q-text">Item ${q.id}: ${q.question}</div>
    `;
  }

  html += `<div class="options-grid">`;
  const letters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, idx) => {
    let btnClass = "option-btn";
    if (isAnswered) {
      if (idx === q.answer) {
        btnClass += " correct-choice";
      } else if (idx === selectedAns) {
        btnClass += " wrong-choice";
      }
    } else if (selectedAns === idx) {
      btnClass += " selected";
    }

    html += `
      <button class="${btnClass}" onclick="selectOption(${idx})" ${isAnswered ? 'disabled' : ''}>
        <span class="option-letter">${letters[idx]}</span>
        <span>${opt}</span>
      </button>
    `;
  });
  html += `</div>`;

  // Explanation Box
  if (isAnswered) {
    const isCorrect = selectedAns === q.answer;
    html += `
      <div class="explanation-box visible">
        <div class="exp-title ${isCorrect ? 'correct' : 'incorrect'}">
          ${isCorrect ? '✓ Correct Answer' : '✗ Incorrect Choice'}
        </div>
        <div class="exp-detail">
          <strong>Key Explanation:</strong> ${q.explanation}
        </div>
      </div>
    `;
  }

  // Navigation Buttons
  html += `
    <div class="controls">
      <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQIndex === 0 ? 'disabled' : ''}>Previous</button>
      ${currentQIndex === total - 1 ? 
        `<button class="btn btn-primary" onclick="finishQuiz()">Finish Examination</button>` : 
        `<button class="btn btn-primary" onclick="nextQuestion()">Next Question</button>`
      }
    </div>
  `;

  container.innerHTML = html;
  updateNavGridUI();
}

function selectOption(index) {
  if (userAnswers[currentQIndex] !== null) return;
  userAnswers[currentQIndex] = index;
  renderQuestion();
}

function nextQuestion() {
  if (currentQIndex < quizData.length - 1) {
    currentQIndex++;
    renderQuestion();
  }
}

function prevQuestion() {
  if (currentQIndex > 0) {
    currentQIndex--;
    renderQuestion();
  }
}

function buildNavGrid() {
  const grid = document.getElementById('gridLayout');
  grid.innerHTML = '';
  quizData.forEach((_, idx) => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.id = `grid-item-${idx}`;
    item.innerText = idx + 1;
    item.onclick = () => {
      currentQIndex = idx;
      renderQuestion();
      closeNavGrid();
    };
    grid.appendChild(item);
  });
}

function updateNavGridUI() {
  quizData.forEach((_, idx) => {
    const item = document.getElementById(`grid-item-${idx}`);
    if (!item) return;
    item.className = 'grid-item';
    if (userAnswers[idx] !== null) item.classList.add('answered');
    if (idx === currentQIndex) item.classList.add('current');
  });
}

function openNavGrid() {
  document.getElementById('navGridModal').style.display = 'flex';
}

function closeNavGrid() {
  document.getElementById('navGridModal').style.display = 'none';
}

function finishQuiz() {
  document.getElementById('quizBody').style.display = 'none';
  document.getElementById('resultsBody').style.display = 'block';

  let score = userAnswers.reduce((acc, ans, idx) => (ans === quizData[idx].answer ? acc + 1 : acc), 0);
  document.getElementById('finalScoreVal').innerText = score;

  const pct = (score / quizData.length) * 100;
  let title = "";
  let feedback = "";

  if (pct >= 90) {
    title = "Outstanding Distinction!";
    feedback = "Exceptional mastery of cereal science, chemical compositions, cellular structures, processing behavior, and taxonomy.";
  } else if (pct >= 75) {
    title = "Passed with Honors";
    feedback = "Strong analytical performance. You demonstrate thorough understanding of complex cereal chemistry and botanical traits.";
  } else if (pct >= 60) {
    title = "Satisfactory Pass";
    feedback = "Good foundation, but review subtle distractor items and statement evaluations to improve mastery.";
  } else {
    title = "Needs Further Review";
    feedback = "Review the uploaded material carefully, focusing on detailed anatomical fractions, protein rheology, and specific diseases.";
  }

  document.getElementById('gradeTitle').innerText = title;
  document.getElementById('gradeFeedback').innerText = feedback;

  renderReviewSection();
}

function renderReviewSection() {
  const container = document.getElementById('reviewContainer');
  const letters = ['A', 'B', 'C', 'D'];
  container.innerHTML = '';

  quizData.forEach((q, idx) => {
    const uAns = userAnswers[idx];
    const isCorrect = uAns === q.answer;

    if (reviewFilter === 'correct' && !isCorrect) return;
    if (reviewFilter === 'incorrect' && isCorrect) return;

    let card = document.createElement('div');
    card.className = `review-card ${isCorrect ? 'is-correct' : 'is-incorrect'}`;

    let content = `
      <div style="font-weight: 700; margin-bottom: 6px;">Item ${q.id}: ${q.topic} ${isCorrect ? '<span style="color:var(--correct-border)">(Correct)</span>' : '<span style="color:var(--incorrect-border)">(Incorrect)</span>'}</div>
    `;

    if (q.type === 'two-statement') {
      content += `
        <div style="margin-bottom: 8px; font-size: 0.85rem; background: #f1f5f9; padding: 8px; border-radius: 4px;">
          <div><strong>Statement 1:</strong> ${q.statement1}</div>
          <div><strong>Statement 2:</strong> ${q.statement2}</div>
        </div>
      `;
    } else {
      content += `<div style="margin-bottom: 8px; font-weight: 500;">${q.question}</div>`;
    }

    content += `
      <div style="font-size: 0.85rem; margin-bottom: 4px;">
        <strong>Your Answer:</strong> ${uAns !== null ? letters[uAns] + '. ' + q.options[uAns] : 'Not Answered'}
      </div>
      <div style="font-size: 0.85rem; color: var(--correct-text); margin-bottom: 8px;">
        <strong>Correct Answer:</strong> ${letters[q.answer]}. ${q.options[q.answer]}
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; background: #f8fafc; padding: 8px; border-radius: 4px;">
        <strong>Explanation:</strong> ${q.explanation}
      </div>
    `;

    card.innerHTML = content;
    container.appendChild(card);
  });
}

function filterReview(type) {
  reviewFilter = type;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderReviewSection();
}

function restartQuiz() {
  currentQIndex = 0;
  userAnswers = new Array(quizData.length).fill(null);
  document.getElementById('resultsBody').style.display = 'none';
  document.getElementById('quizBody').style.display = 'block';
  renderQuestion();
}
</script>
</body>
</html>
